<!--
  Security notification once an email change has completed. Phase 47. Goes to
  the OLD address, which is the one place a hijacked account's real owner
  will see it. No link, for the same reason as the password notification.
-->
<!doctype html>
<html lang="el">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;padding:24px;background:#ffffff;color:#111111;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;">
  <div style="max-width:520px;margin:0 auto;">
    <p style="font-weight:700;font-size:18px;margin:0 0 16px;">MyParty</p>

    <p>Το email του λογαριασμού σου άλλαξε από <strong>{{ .OldEmail }}</strong> σε <strong>{{ .Email }}</strong>.</p>
    <p style="color:#555555;">Αν δεν το έκανες εσύ, γράψε μας αμέσως στο support@mypartycorp.com.</p>

    <hr style="border:none;border-top:1px solid #dddddd;margin:24px 0;">

    <p lang="en">Your account's email was changed from <strong>{{ .OldEmail }}</strong> to <strong>{{ .Email }}</strong>.</p>
    <p lang="en" style="color:#555555;">If this wasn't you, write to us right away at support@mypartycorp.com.</p>
  </div>
</body>
</html>
