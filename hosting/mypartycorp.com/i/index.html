<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    The page an INVITE link shows to someone without the app. Invite links
    are https://mypartycorp.com/i#<token>; with the app installed and verified,
    Android opens the app instead and this is never loaded. See
    hosting/README.md for the rewrite that serves it at /i.

    The token is in the URL FRAGMENT (after #). Browsers never send a fragment
    to the server, so the token is not in any request this page causes, nor in
    any CDN or access log. This page must never read it: no scripts at all
    (the CSP below forbids them), no third-party requests, and no-referrer.
    Same static, says-nothing rule as /p/index.html: no title, no host, not
    even whether the token is valid.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>You're invited on MyParty</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #0B0A10; color: #F4F1F8;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 360px; text-align: center; }
    .mark {
      width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 50%;
      background: linear-gradient(135deg, #534AB7, #F23557);
    }
    h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.3px; }
    p { margin: 0 0 16px; color: rgba(244, 241, 248, 0.62); font-size: 14px; }
    ol { text-align: left; margin: 0 auto 18px; padding-left: 20px; color: rgba(244, 241, 248, 0.75); font-size: 14px; }
    li { margin-bottom: 6px; }
    .note { font-size: 12.5px; color: rgba(244, 241, 248, 0.42); margin: 18px 0 0; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>You're invited to a private party</h1>
    <p>This invite opens in the MyParty app.</p>
    <ol>
      <li>Install MyParty on your Android phone.</li>
      <li>Sign in or create an account.</li>
      <li>Come back to the message and tap this link again.</li>
    </ol>
    <p class="note">The link works only while the host keeps it on, and only for the party it was made for.</p>
  </main>
</body>
</html>
