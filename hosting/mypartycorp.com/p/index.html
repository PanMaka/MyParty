<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    The page a party link shows to someone WITHOUT the app (with the app
    installed and verified, Android opens the app instead and this is never
    loaded). Served for every /p/<id>; see hosting/README.md.

    It is deliberately the same static page for every id and says nothing
    about the party: no title, no time, no place, not even whether the id is
    real. Rendering any of that here would need a server that reads the
    database WITHOUT the viewer's session -- i.e. outside the parties policy --
    and a private party's link would then describe the party to anyone it was
    forwarded to. The app shows the party; this page only says "open the app".

    No scripts, no third-party requests (fonts, analytics, pixels), and
    no-referrer, so the party id in the address bar is never sent anywhere.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>A party on MyParty</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #0B0A10; color: #F4F1F8;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 360px; text-align: center; }
    .mark {
      width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 50%;
      background: linear-gradient(135deg, #534AB7, #F23557);
    }
    h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.3px; }
    p { margin: 0 0 22px; color: rgba(244, 241, 248, 0.62); font-size: 14px; }
    .note { font-size: 12.5px; color: rgba(244, 241, 248, 0.42); margin: 18px 0 0; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>This party is on MyParty</h1>
    <p>Open this link on a phone with the MyParty app installed to see the party.</p>
    <p class="note">If it’s a private party, only the people the host invited can see it.</p>
  </main>
</body>
</html>
